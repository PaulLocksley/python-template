# Release notes for GitLab releases, generated by git-cliff in CI.
[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first }} ({{ commit.id | truncate(length=8, end="") }})
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Commits that do not follow Conventional Commits are still listed, under "Other".
filter_unconventional = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^docs", group = "Documentation" },
    { message = "^(chore|ci|build|style|test|refactor)", skip = true },
    { message = "^Merge ", skip = true },
    { message = ".*", group = "Other" },
]
