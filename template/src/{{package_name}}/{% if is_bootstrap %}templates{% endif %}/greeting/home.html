{% extends "base.html" %}
{% block content %}
    <h1 class="fw-semibold">It works</h1>
    <p class="text-body-secondary">Type a name: htmx swaps in only the greeting partial.</p>
    <input type="search"
           name="name"
           placeholder="Your name"
           autocomplete="off"
           aria-label="Your name"
           class="form-control mt-4"
           hx-get="{% url 'home' %}"
           hx-trigger="input changed delay:200ms"
           hx-target="#greeting"
           hx-swap="outerHTML">
    {% partialdef greeting inline %}
        <p id="greeting" class="mt-4 fs-4 fw-medium" data-flash>{{ greeting.message }}</p>
    {% endpartialdef greeting %}
{% endblock content %}
